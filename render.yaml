services:
  - type: web
    name: aracreate
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace client && npm install --workspace server
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false